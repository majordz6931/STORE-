<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MAJOR STORE — Diagnose Supabase</title>
<link rel="stylesheet" href="css/admin.css" />
</head>
<body style="min-height:100vh;">
<div style="max-width:760px;margin:30px auto;padding:30px;background:var(--surface);border:1px solid var(--line);border-radius:18px;">
<h1 style="color:var(--green);font-family:'Fira Code',monospace;margin-bottom:8px">دليل إعداد Supabase</h1>
<p style="color:var(--ink-mid);font-size:14px;margin-bottom:24px;">اتبع هذه الخطوات بالضبط لتجهيز قاعدة بياناتك.</p>

<div id="steps"></div>

<div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;">
<button class="btn primary" id="startBtn">ابدأ الفحص</button>
<button class="btn outline" id="copyBtn" disabled>📋 نسخ SQL</button>
<button class="btn outline" id="downloadBtn" disabled>⬇ تحميل SQL</button>
<button class="btn outline" id="recheckBtn" disabled>↻ إعادة الفحص</button>
</div>

<textarea id="sqlArea" readonly style="margin-top:18px;width:100%;min-height:240px;background:#0a0f1c;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-family:'Fira Code',monospace;font-size:11px;display:none"></textarea>

<pre id="report" style="margin-top:18px;padding:14px;background:#060b16;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:'Fira Code',monospace;font-size:12px;white-space:pre-wrap;max-height:360px;overflow:auto"></pre>

<a href="admin.html" style="display:inline-block;margin-top:18px;color:var(--cyan);font-family:'Fira Code',monospace;">← العودة إلى لوحة التحكم</a>
</div>

<script src="js/store.js"></script>
<script>
const STEPS = [
  { id: "url", label: "الاتصال بـ Supabase", test: async (url, anon) => {
      const r = await fetch(url + "/auth/v1/health", { headers: { apikey: anon } });
      return r.ok ? "ok: Supabase API responds" : "err: API returned " + r.status;
  }},
  { id: "auth", label: "خدمة Auth فعّالة", test: async (url, anon) => {
      const r = await fetch(url + "/auth/v1/admin/users", { headers: { apikey: anon } });
      // 401 OK (means auth endpoint exists, no admin perms)
      if (r.status === 401) return "ok: Auth endpoint is available";
      if (r.status === 403) return "ok: Auth available, needs service_role key for admin listing";
      return r.ok ? "ok" : "warn: " + r.status;
  }},
  { id: "tables", label: "الجداول موجودة (store_data / orders / messages)", test: async (url, anon) => {
      const tables = ["store_data","orders","messages"];
      const r = {};
      for (const t of tables) {
        const res = await fetch(url + "/rest/v1/" + t + "?select=id&limit=1", { headers: { apikey: anon, Authorization: "Bearer " + anon } });
        r[t] = res.ok;
      }
      const missing = Object.entries(r).filter(([k,v]) => !v).map(([k]) => k);
      if (missing.length === 0) return "ok: all tables present";
      return "err: missing tables: " + missing.join(", ") + " — run supabase-setup.sql in Supabase → SQL Editor";
  }},
  { id: "data", label: "الكتالوج مهيأ بـ 12 منتج على الأقل", test: async (url, anon) => {
      const res = await fetch(url + "/rest/v1/store_data?select=data&id=eq.main&limit=1", { headers: { apikey: anon, Authorization: "Bearer " + anon } });
      if (!res.ok) return "err: store_data not readable";
      const rows = await res.json();
      const products = rows[0] && rows[0].data && rows[0].data.products;
      if (!Array.isArray(products) || products.length < 1) return "warn: no products in cloud yet (run supabase-setup.sql with seed)";
      return "ok: " + products.length + " products in cloud";
  }}
];

let sqlText = ""; let lastReport = "";

function $(s){ return document.getElementById(s); }

async function runAll() {
  const url = "https://vlqdduqgktwaqehkbbsu.supabase.co";
  const anon = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZscWRkdXFna3R3YXFlaGtiYnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDgwNjMsImV4cCI6MjEwMzQyNDA2M30.XEwrGcfjaj50FF2mfJg2ntAk4NEFAO843GEs4TWoH14";
  const container = $("steps");
  container.innerHTML = "";
  const lines = [];
  for (const step of STEPS) {
    const row = document.createElement("div");
    row.className = "diag-row";
    row.innerHTML = "<b>" + step.label + "</b><span class='diag-state'>…</span>";
    container.appendChild(row);
    let result;
    try { result = await step.test(url, anon); } catch (e) { result = "err: " + (e.message||e); }
    const ok = result.startsWith("ok");
    const warn = result.startsWith("warn");
    row.querySelector(".diag-state").innerHTML = ok ? "<span style='color:var(--green)'>✓ "+result+"</span>" : (warn ? "<span style='color:var(--orange)'>⚠ "+result+"</span>" : "<span style='color:var(--red)'>✗ "+result+"</span>");
    lines.push((ok?"[OK] ":warn?"[WARN] ":"[ERR] ") + step.label + " — " + result);
    if (!ok && !warn) break;
  }
  $("recheckBtn").disabled = false;
  $("copyBtn").disabled = false;
  $("downloadBtn").disabled = false;
  lastReport = lines.join("\n");
  $("report").textContent = lastReport;
}

function loadSql() {
  if (sqlText) return Promise.resolve(sqlText);
  return fetch("supabase-setup.sql").then(r => r.text()).then(t => { sqlText = t; return t; });
}

function copySql() {
  loadSql().then(text => {
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(e){} document.body.removeChild(ta);
    $("sqlArea").style.display = "block"; $("sqlArea").value = text;
  });
}

function downloadSql() {
  loadSql().then(text => {
    const blob = new Blob([text], { type: "text/sql" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "supabase-setup.sql"; a.click();
  });
}

$("startBtn").onclick = runAll;
$("recheckBtn").onclick = runAll;
$("copyBtn").onclick = copySql;
$("downloadBtn").onclick = downloadSql;
</script>
<style>
.diag-row{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:rgba(8,14,26,.45)}
.diag-row b{color:var(--ink);font-size:13.5px;flex:1}
.diag-state{font-family:"Fira Code",monospace;font-size:11.5px}
</style>
</body>
</html>
